<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Handschrift</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fafafa;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  textarea {
    width: 100%;
    min-height: 52vh;
    resize: vertical;
    padding: 22px 24px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.65;
    color: #111111;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea:focus {
    border-color: #111111;
    box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.06);
  }
  textarea::placeholder {
    color: #9ca3af;
  }
  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  button {
    width: 100%;
    padding: 14px 20px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: #ffffff;
    background: #111111;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.08s ease;
  }
  button:hover:not(:disabled) {
    background: #27272a;
  }
  button:active:not(:disabled) {
    transform: translateY(1px);
  }
  button:disabled {
    opacity: 0.65;
    cursor: wait;
  }
  .spinner {
    width: 15px;
    height: 15px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    display: none;
  }
  button.loading .spinner {
    display: inline-block;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .notice {
    min-height: 20px;
    font-size: 13px;
    color: #6b7280;
    text-align: center;
    line-height: 1.5;
  }
  .notice.warn {
    color: #b45309;
  }
  .notice.error {
    color: #b91c1c;
  }
</style>
</head>
<body>
  <main>
    <div class="wrap">
      <textarea
        id="inputText"
        placeholder="Text eingeben …"
        spellcheck="false"
        autofocus
      ></textarea>
      <div class="actions">
        <button id="generateBtn" type="button">
          <span class="spinner" aria-hidden="true"></span>
          <span id="btnLabel">.goodnotes generieren</span>
        </button>
        <div id="notice" class="notice" aria-live="polite"></div>
      </div>
    </div>
  </main>

<script>
  // Configured automatically during deployment
  const API_BASE = "https://goodnotes-handwriting-api.vercel.app";

  const FALLBACK_MAP = {
    "\u2019": "'", "\u2018": "'", "\u201d": "\u201c",
    "\u00ab": "\u201e", "\u00bb": "\u201c", "\u2014": "\u2013", "\u00a0": " "
  };

  const textarea = document.getElementById("inputText");
  const btn = document.getElementById("generateBtn");
  const btnLabel = document.getElementById("btnLabel");
  const notice = document.getElementById("notice");

  let availableKeys = null;
  let apiWarm = false;

  // Silent wake-up ping on page load to warm up Vercel Serverless Function
  async function wakeUpApi() {
    if (!API_BASE || API_BASE.startsWith("__")) return;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 35000);
      const res = await fetch(`${API_BASE}/api/health`, {
        method: "GET",
        mode: "cors",
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data.available_keys)) {
          availableKeys = new Set(data.available_keys);
          apiWarm = true;
          checkMissingLive();
        }
      }
    } catch (_) {
      // Silent: cold start will be handled smoothly on submit
    }
  }

  function findMissingChars(text) {
    if (!availableKeys) return [];
    const missing = new Set();
    for (const ch of text) {
      if (/\s/.test(ch)) continue;
      if (availableKeys.has(ch)) continue;
      const fb = FALLBACK_MAP[ch];
      if (fb && availableKeys.has(fb)) continue;
      missing.add(ch);
    }
    return Array.from(missing).sort();
  }

  function checkMissingLive() {
    if (btn.disabled) return;
    const missing = findMissingChars(textarea.value);
    if (missing.length > 0) {
      notice.className = "notice warn";
      notice.textContent = `Nicht in der Zeichenbank (werden übersprungen): ${missing.join(" ")}`;
    } else {
      notice.className = "notice";
      notice.textContent = "";
    }
  }

  textarea.addEventListener("input", checkMissingLive);

  async function postGenerateWithTimeout(text, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      return await fetch(`${API_BASE}/api/generate`, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, title: "Handschrift" }),
        signal: ctrl.signal,
      });
    } finally {
      clearTimeout(timer);
    }
  }

  async function handleGenerate() {
    const text = textarea.value;
    if (!text.trim()) {
      notice.className = "notice warn";
      notice.textContent = "Bitte zuerst Text eingeben.";
      textarea.focus();
      return;
    }

    btn.disabled = true;
    btn.classList.add("loading");
    btnLabel.textContent = apiWarm ? "Wird generiert …" : "Server wacht auf …";
    notice.className = "notice";
    notice.textContent = "";

    let res = null;
    let lastError = null;
    const maxAttempts = 2;

    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        if (attempt === 2) {
          btnLabel.textContent = "Server wacht auf, zweiter Versuch …";
        }
        res = await postGenerateWithTimeout(text, 60000);
        if (res.ok) {
          apiWarm = true;
          break;
        }
        // Retry once on cold-start 502/503/504
        if ((res.status === 502 || res.status === 503 || res.status === 504) && attempt < maxAttempts) {
          await new Promise(r => setTimeout(r, 1500));
          continue;
        }
        let errMsg = `Fehler (${res.status})`;
        try {
          const j = await res.json();
          if (j.error) errMsg = j.error;
        } catch (_) {}
        throw new Error(errMsg);
      } catch (err) {
        lastError = err;
        if (attempt < maxAttempts) {
          await new Promise(r => setTimeout(r, 1500));
          continue;
        }
      }
    }

    try {
      if (!res || !res.ok) {
        throw lastError || new Error("Verbindung fehlgeschlagen.");
      }

      const blob = await res.blob();
      const missingHdr = res.headers.get("X-Missing-Chars");
      let missing = [];
      if (missingHdr) {
        try { missing = JSON.parse(decodeURIComponent(missingHdr)); } catch (_) {}
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "handschrift.goodnotes";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);

      if (missing.length > 0) {
        notice.className = "notice warn";
        notice.textContent = `Nicht in der Zeichenbank (übersprungen): ${missing.join(" ")}`;
      } else {
        notice.className = "notice";
        notice.textContent = "";
      }
    } catch (err) {
      notice.className = "notice error";
      notice.textContent = err.name === "AbortError"
        ? "Zeitüberschreitung beim Aufwachen der API. Bitte erneut versuchen."
        : (err.message || "Download fehlgeschlagen.");
    } finally {
      btn.disabled = false;
      btn.classList.remove("loading");
      btnLabel.textContent = ".goodnotes generieren";
    }
  }

  btn.addEventListener("click", handleGenerate);
  wakeUpApi();
</script>
</body>
</html>
